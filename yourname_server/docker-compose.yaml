services:
  # Development services
  postgres:
    image: pgvector/pgvector:pg16
    ports:
      - "8090:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_DB: yourname
      POSTGRES_PASSWORD: "uSfTF4fveRwHkiyDiuuFR9yPZ4E-9qc0"
    volumes:
      - yourname_data:/var/lib/postgresql/data

  redis:
    image: redis:6.2.6
    ports:
      - "8091:6379"
    command: redis-server --requirepass "_-HF-2r76ikFKXilYTjPucsSvhlPTcrX"
    environment:
      - REDIS_REPLICATION_MODE=master

  # Test services
  postgres_test:
    image: pgvector/pgvector:pg16
    ports:
      - "9090:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_DB: yourname_test
      POSTGRES_PASSWORD: "QZvaNnUSx1Pqel_f3N5vQQzqB_O3O8Wl"
    volumes:
      - yourname_test_data:/var/lib/postgresql/data

  redis_test:
    image: redis:6.2.6
    ports:
      - "9091:6379"
    command: redis-server --requirepass "UQBD7Jmo650tnAhw-s3_uzZyswGfLfYk"
    environment:
      - REDIS_REPLICATION_MODE=master

volumes:
  yourname_data:
  yourname_test_data:
